<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <!-- Utilby Master Vector - App Icon Squircle (Light Canvas Edition) -->
  <defs>
    <linearGradient id="bgLightGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F0EC"/>
    </linearGradient>
    <linearGradient id="sunAppLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFDB70"/>
      <stop offset="100%" stop-color="#FFB31A"/>
    </linearGradient>
    <filter id="lightShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#16141F" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Squircle Container -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgLightGradient)"/>
  <rect x="24" y="24" width="464" height="464" rx="104" stroke="#16141F" stroke-opacity="0.08" stroke-width="2"/>

  <!-- Centered Icon Mark -->
  <g filter="url(#lightShadow)">
    <path d="M148 136 V264 C148 324 196 372 256 372 C316 372 364 324 364 264 V136" 
          stroke="#16141F" 
          stroke-width="64" 
          stroke-linecap="round"/>
    <circle cx="256" cy="264" r="62" fill="url(#sunAppLight)"/>
  </g>
</svg>