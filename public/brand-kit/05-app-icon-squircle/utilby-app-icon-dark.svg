<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <!-- Utilby Master Vector - App Icon Squircle (Dark Ink Edition) -->
  <defs>
    <linearGradient id="bgDarkGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#242132"/>
      <stop offset="100%" stop-color="#121019"/>
    </linearGradient>
    <linearGradient id="sunAppDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFDB70"/>
      <stop offset="100%" stop-color="#FFB31A"/>
    </linearGradient>
    <filter id="appGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- iOS / macOS Squircle Container -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgDarkGradient)"/>
  <rect x="24" y="24" width="464" height="464" rx="104" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="2"/>

  <!-- Centered Icon Mark -->
  <g filter="url(#appGlow)">
    <path d="M148 136 V264 C148 324 196 372 256 372 C316 372 364 324 364 264 V136" 
          stroke="#FFFFFF" 
          stroke-width="64" 
          stroke-linecap="round"/>
    <circle cx="256" cy="264" r="62" fill="url(#sunAppDark)"/>
  </g>
</svg>