<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <!-- Utilby Master Vector - Frosted Glassmorphism Badge (Transparent Background) -->
  <defs>
    <linearGradient id="glassFillTr" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="glassBorderTr" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.7"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="sunGlowTr" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFDB70"/>
      <stop offset="100%" stop-color="#FFB31A"/>
    </linearGradient>
    <filter id="glassShadowTr" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Frosted Glass Plate -->
  <rect x="48" y="48" width="416" height="416" rx="104" 
        fill="url(#glassFillTr)" 
        stroke="url(#glassBorderTr)" 
        stroke-width="3.5" 
        filter="url(#glassShadowTr)"/>

  <!-- U Monogram Inside Glass -->
  <path d="M168 160 V268 C168 317 207 356 256 356 C305 356 344 317 344 268 V160" 
        stroke="#16141F" 
        stroke-width="56" 
        stroke-linecap="round"/>

  <!-- Glowing Sun Core -->
  <circle cx="256" cy="268" r="52" fill="url(#sunGlowTr)"/>
</svg>
