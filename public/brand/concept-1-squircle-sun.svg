<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B2B"/>
      <stop offset="100%" stop-color="#121019"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD466"/>
      <stop offset="100%" stop-color="#FFAE1A"/>
    </linearGradient>
    <filter id="sunGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#FFC53D" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle Inner Border Highlight -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.08"/>

  <!-- Stylized Geometric "u" Monogram -->
  <path d="M168 160 V280 C168 333 211 376 264 376 C317 376 360 333 360 280 V160" 
        fill="none" 
        stroke="#FFFFFF" 
        stroke-width="48" 
        stroke-linecap="round"/>

  <!-- Signature Glowing Sun Orb -->
  <circle cx="264" cy="272" r="44" fill="url(#sunGrad)" filter="url(#sunGlow)"/>
</svg>
